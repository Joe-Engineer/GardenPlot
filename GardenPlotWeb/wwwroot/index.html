<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Garden Plot</title>
    <base href="/" />
    <link rel="stylesheet" href="lib/bootstrap/dist/css/bootstrap.min.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="GardenPlotWeb.styles.css" />
    <link rel="icon" type="image/png" href="favicon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="192x192" href="icon-192.png" />
    <meta name="theme-color" content="#3c7a3b" />
</head>

<body>
    <div id="app">
        <div style="display:flex;align-items:center;justify-content:center;height:100vh;font-family:sans-serif;color:#555;">
            Loading Garden Plot&hellip;
        </div>
    </div>

    <div id="blazor-error-ui" data-nosnippet>
        <strong>Garden Plot hit a snag.</strong>
        Your saved plots and photos are safe in browser storage.
        Open the browser console (F12 &rarr; Console) for diagnostic details.
        <a href="." class="reload">Reload</a>
        <span class="dismiss" title="Dismiss">&#x1F5D9;</span>
    </div>

    <script src="js/client-images.js" type="module"></script>
    <script src="js/client-store.js" type="module"></script>
    <script src="_framework/blazor.webassembly.js" autostart="true"></script>
    <script>
        // PWA: register the service worker only when the browser supports it
        // AND we're served over a secure origin (HTTPS or localhost). The dev
        // service worker is a passthrough; the published one is a precache that
        // makes the app work offline.
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('service-worker.js').catch(err => {
                    console.warn('GardenPlot: service worker registration failed', err);
                });
            });
        }
    </script>
</body>

</html>
