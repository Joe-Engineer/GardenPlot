# Build and deploy GardenPlotWeb (Blazor Server, .NET 10) to Azure App Service
# Auth: OIDC federated identity (no secrets/passwords)
# Docs: https://github.com/Azure/login

name: 'Build and deploy ASP.Net Core app to Azure Web App: gardenplot'

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write   # required for OIDC token request
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Publish GardenPlotWeb
        # Scope to the web project only; the Aspire AppHost is dev-only
        # and not deployed to App Service.
        run: |
          dotnet publish ./GardenPlotWeb/GardenPlotWeb.csproj \
            --configuration Release \
            --output ${{ runner.temp }}/publish

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'gardenplot'
          slot-name: 'production'
          package: ${{ runner.temp }}/publish


