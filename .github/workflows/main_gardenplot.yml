# Build and deploy GardenPlotWeb (Blazor Server, .NET 10) to Azure App Service
# Docs: https://github.com/Azure/webapps-deploy

name: 'Build and deploy ASP.Net Core app to Azure Web App: gardenplot'

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Publish GardenPlotWeb
        # Scope to the web project only; the Aspire AppHost is dev-only
        # and not deployed to App Service.
        run: |
          dotnet publish ./GardenPlotWeb/GardenPlotWeb.csproj \
            --configuration Release \
            --output ${{ runner.temp }}/publish

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v2
        with:
          app-name: 'gardenplot'
          slot-name: 'production'
          publish-profile: ${{ secrets.AzureAppService_PublishProfile_0dc4d345247740a7bc6eec0497322b0f }}
          package: ${{ runner.temp }}/publish

