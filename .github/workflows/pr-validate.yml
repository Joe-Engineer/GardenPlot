# Validates pull requests against `main` by building with warnings-as-errors
# and running the full test suite.
name: 'PR validate (build + test)'

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          dotnet-quality: 'preview'

      - name: Restore
        run: dotnet restore ./GardenPlot.slnx

      - name: Build (warnings-as-errors)
        run: dotnet build ./GardenPlot.slnx --no-restore --configuration Release -warnaserror

      - name: Test
        run: dotnet test ./GardenPlot.slnx --no-build --configuration Release --logger "console;verbosity=normal"
